input: "genomes/*.faa" #"genomes/G_011_1B_oryzifermentans_assembly_called_genes.faa" #"genomes/*.faa"
outdir: "results"

# ============================================================
# carveme settings
# ============================================================
run_carveme: false
solver: "scip"

carveme_args: "" # use for other carvme arguments, ex: "--default-score -2"

# Universe settings, only use one
universe: "gramneg"
#universe_file: /home/hahollan/MIRA/fba_aab/carveme-nextflow/assets/universe/iAp386B454_bigg.xml # change to path to custom universe file

# Soft reconstruction constraints (optional); to disable, set to null
carveme_soft_constraints: "assets/carveme_soft_constraints.tsv"

# Media options, each media option that is not null will be run
media_databases:
  NO_GAPFILL: null
  "M9[-O2]": null
  SDMM: "assets/SDMM_media.tsv"
  "SDMM_ETOH": "assets/SDMM_media_etoh.tsv"

# ============================================================
# gapseq settings
# ============================================================

run_gapseq: true

# Sequence alignment backend:
# options are blast, diamond, or mmseqs2
gapseq_aligner: "diamond"

# Restrict reference sequences to bacterial proteins
gapseq_taxonomy: "Bacteria"

# null = allow gapseq to predict the gap-filling medium automatically
# Later this can point to a gapseq-formatted medium file
gapseq_medium: null

# Optional external gapseq sequence database.
# Leave null for initial testing.
gapseq_db: "/home/hahollan/MIRA/fba_aab/carveme-nextflow/assets/gapseq_db"

# Additional arguments passed directly to gapseq doall
gapseq_args: ""


# ============================================================
# # Cobrapy settings
# ============================================================

run_cobra: true
modelseed_db: "assets/ModelSEEDDatabase"

